---
grails:
    config:
        locations:
            - file:/data/profile-service/config/profile-service-config.properties
            - file:/data/profile-service/config/profile-service-config.yml
            - file:/data/profile-service/config/profile-service-config.groovy
    profile: web
    codegen:
        defaultPackage: au.org.ala.profile

info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
spring:
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            exclude:
                - grails-app/views/**
                - grails-app/i18n/**
                - grails-app/conf/**
management:
    endpoints:
        # "none" keeps every actuator endpoint disabled unless one is granted access explicitly
        access:
            default: "none"

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
        upload:
            maxFileSize: 5000000
            maxRequestSize: 5000000
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

---
environments:
    development:
        grails:
            mongodb:
                host: localhost
                port: 27017
                databaseName: profiles
    test:
        grails:
            mongodb:
                host: localhost
                port: 27017
                databaseName: profiles-test
            serverURL: http://devt.ala.org.au:8080
    production:
        grails:
            mongodb:
                host: localhost
                port: 27017
                databaseName: profiles

security:
    cas:
        enabled: false
        uriExclusionFilterPattern:
            - '/assets/*'
        uriFilterPattern:
        authenticateOnlyIfCookieFilterPattern:
        authenticateOnlyIfLoggedInFilterPattern:

    oidc:
        enabled: true
        discoveryUri: https://auth.ala.org.au/cas/oidc/.well-known
        scope: openid,profile,email,ala,roles
        clientId: some-client-id
        secret: some-client-secret

    jwt:
        discoveryUri: https://auth.ala.org.au/cas/oidc/.well-known
        enabled: true
        fallbackToLegacyBehaviour: true
        requiredScopes: profile-service/write
---
#reverse proxy support
server:
    forward-headers-strategy: native
    tomcat:
        remoteip:
            port-header: 'X-Forwarded-Port'
            protocol-header: 'X-Forwarded-Proto'
            remote-ip-header: 'X-Forwarded-For'
        # Tomcat 10.1 defaults to 10 parts per multipart request which breaks large multipart forms
        max-part-count: 100
